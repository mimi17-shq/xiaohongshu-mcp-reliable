services:
  xiaohongshu-mcp:
    # Build this reliability fork locally. No prebuilt fork image is published yet.
    build:
      context: ..
      dockerfile: Dockerfile
    image: xiaohongshu-mcp-reliable:local
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    init: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    environment:
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CONFIG_HOME=/app/data/config
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    ports:
      - "18060:18060"
